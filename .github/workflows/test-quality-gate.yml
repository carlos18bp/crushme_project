name: Test Quality Gate

on:
  pull_request:
    branches:
      - main
      - master
      - 'release/**'
    paths:
      - 'backend/crushme_app/tests/**'
      - 'frontend/test/**'
      - 'frontend/e2e/**'
      - 'scripts/test_quality_gate.py'
      - 'scripts/quality/**'
      - 'frontend/scripts/ast-parser.cjs'
      - 'frontend/scripts/check-flow-definitions-sync.mjs'
      - '.testquality.yml'
      - '.junk-baseline.json'
      - 'docs/TESTING_QUALITY_STANDARDS.md'
      - 'docs/DJANGO_VUE_ARCHITECTURE_STANDARD.md'
      - 'docs/GLOBAL_RULES_GUIDELINES.md'
      - 'docs/BACKEND_AND_FRONTEND_COVERAGE_REPORT_STANDARD.md'
      - 'docs/E2E_FLOW_COVERAGE_REPORT_STANDARD.md'
      - 'docs/TEST_QUALITY_GATE_REFERENCE.md'
      - 'docs/CRUSHME_ARCHITECTURE_PROFILE.md'
      - '.standards-baseline.json'
      - 'scripts/check_standards_baseline.py'
      - '.pre-commit-config.yaml'
      - '.github/workflows/test-quality-gate.yml'
  push:
    branches:
      - main
      - master
      - 'release/**'
    paths:
      - 'backend/crushme_app/tests/**'
      - 'frontend/test/**'
      - 'frontend/e2e/**'
      - 'scripts/test_quality_gate.py'
      - 'scripts/quality/**'
      - 'frontend/scripts/ast-parser.cjs'
      - 'frontend/scripts/check-flow-definitions-sync.mjs'
      - '.testquality.yml'
      - '.junk-baseline.json'
      - 'docs/TESTING_QUALITY_STANDARDS.md'
      - 'docs/DJANGO_VUE_ARCHITECTURE_STANDARD.md'
      - 'docs/GLOBAL_RULES_GUIDELINES.md'
      - 'docs/BACKEND_AND_FRONTEND_COVERAGE_REPORT_STANDARD.md'
      - 'docs/E2E_FLOW_COVERAGE_REPORT_STANDARD.md'
      - 'docs/TEST_QUALITY_GATE_REFERENCE.md'
      - 'docs/CRUSHME_ARCHITECTURE_PROFILE.md'
      - '.standards-baseline.json'
      - 'scripts/check_standards_baseline.py'
      - '.pre-commit-config.yaml'
      - '.github/workflows/test-quality-gate.yml'

permissions:
  contents: read

concurrency:
  group: test-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical Base Vue standards
        run: python3 scripts/check_standards_baseline.py --repo-root .

  test-quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Run test quality gate
        run: |
          mkdir -p test-results
          python3 scripts/test_quality_gate.py \
            --repo-root . \
            --report-path test-results/test-quality-report.json \
            --junk-severity=error \
            --no-color

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-quality-report
          path: test-results/test-quality-report.json
          if-no-files-found: error

  e2e-flow-definitions-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'Verify flow definitions against E2E @flow tags'
        working-directory: frontend
        run: node scripts/check-flow-definitions-sync.mjs
