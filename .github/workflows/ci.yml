name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - 'release/**'
  push:
    branches:
      - main
      - master
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  backend-tests:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENV: test
      DJANGO_SETTINGS_MODULE: crushme_project.settings_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend suite
        run: |
          mkdir -p test-results
          pytest \
            --cov=crushme_app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results/backend.xml

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/coverage.xml
            backend/test-results/backend.xml
          if-no-files-found: warn

  frontend-unit:
    name: Frontend unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit suite
        run: npm test -- --ci --runInBand --coverage

      - name: Build frontend
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: frontend/coverage/
          if-no-files-found: warn

  frontend-e2e:
    name: Frontend E2E (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      DJANGO_ENV: e2e
      DJANGO_SETTINGS_MODULE: crushme_project.settings_e2e
      E2E_PYTHON: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify flow registry synchronization
        working-directory: frontend
        run: npm run check:e2e-flow-sync

      - name: Run E2E suite
        working-directory: frontend
        run: npm run e2e

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-reports
          path: |
            frontend/e2e-results/
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn

  mysql-migrations:
    name: MySQL migration compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: crushme_ci
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=${{ github.run_id }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENV: test
      DJANGO_SETTINGS_MODULE: crushme_project.settings_ci_mysql
      CI_MYSQL_DATABASE: crushme_ci
      CI_MYSQL_USER: root
      CI_MYSQL_PASSWORD: ${{ github.run_id }}
      CI_MYSQL_HOST: 127.0.0.1
      CI_MYSQL_PORT: '3306'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations on MySQL
        run: python manage.py migrate --noinput

      - name: Run Django compatibility checks
        run: python manage.py check --database default
