server {
    listen 80;
    server_name crushme.com.co www.crushme.com.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name crushme.com.co www.crushme.com.co;

    ssl_certificate /etc/letsencrypt/live/crushme.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crushme.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/security-headers.conf;

    # Twelve validated 5 MB images plus multipart overhead.
    client_max_body_size 64M;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location /static/frontend/assets/ {
        alias /home/ryzepeck/webapps/crushme_project/backend/staticfiles/frontend/assets/;
        access_log off;
        etag on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /static/ {
        alias /home/ryzepeck/webapps/crushme_project/backend/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /media/ {
        alias /home/ryzepeck/webapps/crushme_project/backend/media/;
        expires 7d;
    }

    location /api/ {
        include /etc/nginx/snippets/geo-block.conf;
        limit_req zone=api burst=10 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        include /etc/nginx/snippets/geo-block.conf;
        limit_req zone=general burst=20 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
